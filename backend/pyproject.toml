[project]
name = "agent-wire-docling-backend"
version = "0.1.0"
description = "FastAPI + Docling sidecar for agent-wire-docling"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Locked via pre-flight P1 — see docs/docling-probes.md
    "docling==2.90.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
awd = "backend.cli:app"

[tool.uv]
# Keep the resolver strict — we want reproducible builds
resolution = "highest"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
